<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your children · School lunches</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/family/family.css">
  <script type="module" src="/family/children/children.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top" id="top"></header>
    <main>
      <p><a class="btn quiet" href="/family/">Back to your lunches</a></p>
      <h1>Your children</h1>
      <p id="loading" class="muted">Loading…</p>
      <p id="page-error" class="error box" role="alert" hidden></p>
      <ul id="child-list" class="list card" hidden></ul>

      <form id="child-form" class="card" novalidate hidden style="margin-top:18px">
        <h2 id="form-title" style="margin-top:0">Add a child</h2>
        <label class="field" for="first-name">First name</label>
        <input id="first-name" class="text" type="text" autocomplete="off" autocapitalize="words" maxlength="30">
        <p class="field-error" data-for="first_name" role="alert" hidden></p>

        <label class="field" for="class">Class</label>
        <select id="class" class="text"></select>
        <p class="field-error" data-for="class_id" role="alert" hidden></p>

        <fieldset style="border:0;padding:0;margin:16px 0 0">
          <legend class="field" style="font-weight:650;margin-bottom:4px">Allergies</legend>
          <p class="muted small">Tick every allergy. The order page warns in red when an item has one of them.</p>
          <div id="allergy-list"></div>
          <p class="field-error" data-for="allergies" role="alert" hidden></p>
        </fieldset>

        <p id="child-error" class="error box" role="alert" hidden></p>
        <div class="row" style="margin-top:18px">
          <button id="save-child" class="btn primary big" type="submit">Save</button>
          <button id="cancel-edit" class="btn" type="button" hidden>Stop editing</button>
        </div>
        <p id="child-saved" class="status-ok" role="status" hidden></p>
      </form>

      <p style="margin-top:22px"><a class="btn" href="/family/order/">Order lunches</a></p>
    </main>
  </div>
</body>
</html>
