# School Lunch Orders Worker. Local only tonight: wrangler dev --local. Never deploy, never --remote.
# TEST_MODE is never set here: tests pass --var TEST_MODE:1 on the command line.
name = "school-lunch-orders"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "school-lunch-orders"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Daily housekeeping: expired sessions and old PIN / family-code attempts.
[triggers]
crons = ["0 7 * * *"]
